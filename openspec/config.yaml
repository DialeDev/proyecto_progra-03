# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Java 21, Swing, SQL Server via JDBC (mssql-jdbc), Ant/NetBeans build
  Architecture: MVC + Repository pattern (View → Controller → Repository → SQL Server)
  Testing: No test runner or tests detected. Ant/JUnit infrastructure exists in build.xml but unused.
  Style: Spanish naming in UI/business layer, MVC separation, single entry point (main.App.java).
  Conventions: NetBeans .form files for Swing UI, strict layering enforced in AGENTS.md.

strict_tdd: false

testing:
  runner: null
  unit: false
  integration: false
  e2e: false
  coverage: false
  linter: false
  type_checker: false
  formatter: false

rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference the MVC + Repository architecture constraints
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Respect separation of concerns: Views must not contain business logic
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing MVC + Repository patterns
    - Respect NetBeans .form file integrity (use netbeans-form-safe-edit skill)
    - Keep Spanish naming convention for business classes
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "ant build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
